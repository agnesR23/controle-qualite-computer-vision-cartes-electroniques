name: Daily deployment health check

on:
  schedule:
    - cron: "15 9 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Wake up and check Streamlit application
        run: |
          python - <<'PY'
          from playwright.sync_api import (
              TimeoutError as PlaywrightTimeoutError,
              sync_playwright,
          )

          url = (
              "https://controle-qualite-computer-vision-"
              "cartes-electroniques.streamlit.app/"
          )
          expected_title = "Contrôle qualité automatisé des cartes électroniques"

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=300_000)
              print(f"Opened URL: {page.url}")

              wake_button = page.get_by_role(
                  "button",
                  name="Yes, get this app back up!",
              )

              try:
                  wake_button.wait_for(state="visible", timeout=15_000)
                  wake_button.click()
                  print("Streamlit wake-up button clicked.")
              except PlaywrightTimeoutError:
                  print("Streamlit application was not sleeping.")

              page.get_by_role(
                  "heading",
                  name=expected_title,
              ).wait_for(state="visible", timeout=300_000)

              print(f"Streamlit application available: {page.url}")
              browser.close()
          PY

      - name: Check Hugging Face API
        run: |
          response="$(curl \
            --fail \
            --location \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 20 \
            --max-time 300 \
            --silent \
            --show-error \
            "https://agnesr23-pcb-defect-detection-api.hf.space/health")"

          echo "$response"
          echo "$response" | grep -q '"status":"ok"'
          echo "$response" | grep -q '"model_loaded":true'