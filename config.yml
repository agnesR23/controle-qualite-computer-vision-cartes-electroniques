project:
  random_seed: 42

dataset:
  name: pcb_defect_dataset
  root_dir: data/processed/pcb-defect-dataset

benchmark:
  selected_models:
    - yolov8s
    - faster_rcnn_resnet50_fpn
  baseline_model: faster_rcnn_resnet50_fpn
  primary_model: yolov8s

training:
  image_size: 640
  epochs: 10
  device: auto
  num_workers: 4
  augmentation:
    horizontal_flip: 0.5
    vertical_flip: 0.0
    rotation_degrees: 5

models:
  yolov8s:
    pretrained: true
    batch_size: 16
    optimizer: adamw
    learning_rate: 0.001
    weight_decay: 0.0005

  faster_rcnn_resnet50_fpn:
    pretrained: true
    batch_size: 2
    optimizer: sgd
    learning_rate: 0.005
    weight_decay: 0.0005
    train_subset_size: 3000
    force_cpu: true
    num_workers: 0
    epochs: 1
      
inference:
  image_size: 640
  thresholds:
    confidence: 0.30
    iou: 0.50